spring:
  config:
    activate:
      on-profile: prod
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${USER_SERVICE_DB_HOST}:${USER_SERVICE_DB_PORT}/${USER_SERVICE_DB_NAME}
    username: ${USER_SERVICE_DB_USERNAME}
    password: ${USER_SERVICE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    port: ${RABBITMQ_PORT:5672}
    host: ${RABBITMQ_HOST}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

  threads:
    virtual:
      enabled: true

jwt:
  secretKey: ${JWT_SECRET_KEY}
  accessTokenExpirationTime: ${JWT_ACCESS_TOKEN_EXPIRATION:259200000}
  refreshTokenExpirationTime: ${JWT_REFRESH_TOKEN_EXPIRATION:2419200000}
  resetPasswordTokenExpirationTime: ${JWT_RESET_PASSWORD_TOKEN_EXPIRATION:900000}

rabbitmq:
  exchange-name: ${USER_SERVICE_RABBITMQ_EXCHANGE_NAME}
  user-mail-routing-key: ${USER_SERVICE_RABBITMQ_USER_MAIL_ROUTING_KEY}
  user-mail-queue: ${USER_SERVICE_RABBITMQ_USER_MAIL_QUEUE}
  cache-data-queue: ${RABBITMQ_CACHE_DATA_QUEUE}

server:
  port: ${USER_SERVICE_PORT:8083}

cloudinary:
  cloudinary-name: ${USER_SERVICE_CLOUDINARY_NAME}
  api-key: ${USER_SERVICE_CLOUDINARY_API_KEY}
  api-secret: ${USER_SERVICE_CLOUDINARY_API_SECRET}

payment:
  frontend-base-url: ${PAYMENT_FRONTEND_BASE_URL}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    pay-url: ${VNPAY_PAY_URL}
    api-url: ${VNPAY_API_URL}
